<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Message Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div class="sidebar-header">
                <h2>IM Viewer</h2>
                <select id="org-select">
                    <option value="all">All Organizations</option>
                    <!-- Orgs will be populated here -->
                </select>
                <div class="search-container">
                    <input type="text" id="user-search" placeholder="Search by username..." />
                </div>
            </div>
            <div id="session-list">
                <!-- Session items will be populated here -->
            </div>
        </div>
        <div id="main-content">
            <div id="chat-header">
                <h3 id="chat-title">Select a session</h3>
                <span id="chat-meta"></span>
            </div>
            <div id="message-list">
                <!-- Messages will be populated here -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
